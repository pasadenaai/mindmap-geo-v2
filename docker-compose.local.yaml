# ── Local development stack ────────────────────────────────────────────────
# Usage:
#   scripts/dev_env_init.sh            # one-time: generates .env.local
#   docker compose --env-file .env.local -f docker-compose.local.yaml up -d --build
#
# Services:
#   localstack      → DynamoDB + S3 on port 4570
#   dynamodb-admin  → DynamoDB browser UI on port 8005
#   backend         → FastAPI on port 8004
#   frontend-dev    → React/Vite hot reload on port 4203
#
# Data persistence:
#   DynamoDB data lives in ./geo_localstack_data/ (bind mount, survives restarts)
#   To wipe:  rm -rf geo_localstack_data/state/

services:

  # ── LocalStack (DynamoDB + S3) ───────────────────────────────────────────
  localstack:
    image: localstack/localstack:3.4
    ports:
      - "4570:4566"
    environment:
      - SERVICES=dynamodb,s3
      - AWS_DEFAULT_REGION=us-east-1
      - PERSISTENCE=1
    volumes:
      - ./geo_localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # ── DynamoDB Admin UI ────────────────────────────────────────────────────
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin
    ports:
      - "8005:8001"
    environment:
      - DYNAMO_ENDPOINT=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${LOCALSTACK_ACCESS_KEY_ID:?run scripts/dev_env_init.sh and pass --env-file .env.local}
      - AWS_SECRET_ACCESS_KEY=${LOCALSTACK_SECRET_ACCESS_KEY:?run scripts/dev_env_init.sh and pass --env-file .env.local}
    depends_on:
      localstack:
        condition: service_healthy

  # ── FastAPI backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    ports:
      - "8004:8000"
    env_file:
      - .env.local
    volumes:
      - ./backend/app:/app/app
    depends_on:
      localstack:
        condition: service_healthy
    restart: unless-stopped

  # ── React/Vite dev server (hot reload) ───────────────────────────────────
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
    ports:
      - "4203:4203"
    environment:
      - VITE_API_TARGET=http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./assets:/app/public/assets
    depends_on:
      - backend
