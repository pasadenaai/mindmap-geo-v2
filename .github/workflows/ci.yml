name: CI

# Offline checks only: no AWS credentials, no deploys. Mirrors the commands in CLAUDE.md.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: pytest tests -q
        working-directory: backend

  infra-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/requirements.txt
      # aws-cdk-lib is pinned here to the version verified against the CDK CLI (KNOWN_ISSUES:
      # "CDK CLI vs aws-cdk-lib version drift"); infra/requirements.txt still allows a range.
      - run: pip install -r infra/requirements.txt "aws-cdk-lib==2.240.0" pytest
      - run: pytest tests -q
        working-directory: infra

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # VITE_API_URL stays unset: same-origin build, as deployed.
      - run: npm run build
        working-directory: frontend

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/scan_secrets.sh
